name: build-check x64 release

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1

    - name: Building project
      run: |
        msbuild TempleWare-External.sln -t:Rebuild -p:Configuration=Release -p:Platform=x64

    - name: Debug: Check for generated executable
      run: dir "D:\a\TempleWare-External\TempleWare-External\x64\Release\"

    - name: Archive artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Compiled-Binaries
        path: |
          D:\a\TempleWare-External\TempleWare-External\x64\Release\TempleWare-External.exe
