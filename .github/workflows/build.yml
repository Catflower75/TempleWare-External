name: Build and Check x64 Release

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1

    - name: Build Project
      run: |
        msbuild TempleWare-External.sln -t:Rebuild -p:Configuration=Release -p:Platform=x64

    - name: Verify Executable
      run: dir "D:/a/TempleWare-External/TempleWare-External/x64/Release/"

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Compiled-Binaries
        path: |
          D:/a/TempleWare-External/TempleWare-External/x64/Release/TempleWare-External.exe
